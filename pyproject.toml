[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentvigil"
version = "0.1.0"
description = "Supply-chain security for the instructions your AI agent obeys."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "agentvigil contributors" }]
keywords = ["security", "ai-agents", "mcp", "prompt-injection", "supply-chain", "sarif"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
llm = ["boto3>=1.34"]
sign = ["cryptography>=42"]
dev = ["pytest>=8"]

[project.scripts]
vigil = "vigil.cli:main"

[tool.setuptools.packages.find]
include = ["vigil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
