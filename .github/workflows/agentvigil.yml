name: agentvigil
on: [pull_request, push]

permissions:
  contents: read
  security-events: write

jobs:
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"

      - name: tests
        run: python -m pytest -q

      - name: benchmark (payload recall + benign quiet)
        run: python -m bench.run

      - name: clean fixture must stay clean
        run: vigil scan examples/clean-repo --fail-on high

      - name: evil fixture must be detected (exit 1)
        run: |
          set +e
          vigil scan examples/evil-repo --fail-on high -q
          status=$?
          set -e
          test "$status" -eq 1

      - name: SARIF for the Security tab
        run: |
          set +e
          vigil scan examples/evil-repo --sarif > vigil.sarif
          test $? -eq 1

      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: vigil.sarif, category: agentvigil }
